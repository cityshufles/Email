<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Photo Upload</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@5/dist/spacelab/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
    <style>
        body {
            padding: 1rem 0;
        }

        .upload-shell {
            max-width: 980px;
            margin: 0 auto;
        }

        .queue-preview {
            width: 100%;
            height: 140px;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <main class="container upload-shell">
        <div class="card shadow-sm">
            <div class="card-header d-flex justify-content-between align-items-center">
                <div class="fw-semibold">
                    <i class="bi bi-camera me-1"></i>Photo Upload
                </div>
                <a id="returnLink" href="/guide-report" class="btn btn-sm btn-outline-secondary">
                    <i class="bi bi-arrow-left me-1"></i>Back
                </a>
            </div>
            <div class="card-body">
                <div class="mb-3">
                    <input id="fileInput" type="file" accept="image/*" multiple class="form-control" />
                </div>

                <div class="d-flex flex-wrap gap-2 mb-3">
                    <button id="uploadButton" type="button" class="btn btn-success">
                        <i class="bi bi-cloud-upload me-1"></i>Upload
                    </button>
                    <button id="refreshButton" type="button" class="btn btn-outline-primary">
                        <i class="bi bi-arrow-clockwise me-1"></i>Refresh
                    </button>
                    <button id="clearButton" type="button" class="btn btn-outline-secondary">
                        <i class="bi bi-x-circle me-1"></i>Clear
                    </button>
                </div>

                <div id="status" class="alert alert-info py-2">Loading...</div>
                <div id="queue" class="mb-3"></div>
                <div id="gallery"></div>
            </div>
        </div>
    </main>

    <script src="/js/mobile-photo-uploader.js?v=20260221b"></script>
</body>
</html>
